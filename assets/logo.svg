<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="vitalink-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Isotipo: Escudo de Protección + Pulso Cardíaco + Nodo de Conexión -->
  <g transform="translate(10, 10)">
    <!-- Escudo suave de fondo -->
    <path d="M40 5 C58 5, 75 14, 75 32 C75 58, 40 76, 40 76 C40 76, 5 58, 5 32 C5 14, 22 5, 40 5 Z" fill="url(#vitalink-grad)" opacity="0.15" />
    
    <!-- Contorno del escudo protector -->
    <path d="M40 5 C58 5, 75 14, 75 32 C75 58, 40 76, 40 76 C40 76, 5 58, 5 32 C5 14, 22 5, 40 5 Z" stroke="url(#vitalink-grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Pulso Vital y Eslabón de Conexión -->
    <path d="M16 40 L28 40 L34 24 L42 56 L48 34 L54 44 L64 44" stroke="#0284C7" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    <path d="M16 40 L28 40 L34 24 L42 56 L48 34 L54 44 L64 44" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Puntos de Conexión / Red -->
    <circle cx="16" cy="40" r="3.5" fill="#0D9488" />
    <circle cx="64" cy="44" r="3.5" fill="#10B981" />
    <circle cx="40" cy="18" r="3" fill="#38BDF8" />
  </g>

  <!-- Tipografía del Logotipo: VitaLink -->
  <text x="96" y="58" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="42" font-weight="800" fill="#0F172A" letter-spacing="-0.02em">Vita<tspan fill="#0284C7">Link</tspan></text>
  
  <!-- Slogan / Subtítulo -->
  <text x="98" y="77" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#64748B" letter-spacing="0.18em">ECOSISTEMA DE SALUD PREVENTIVA</text>
  
  <!-- Punto indicador de estado activo -->
  <circle cx="360" cy="40" r="4.5" fill="#10B981" />
  <circle cx="360" cy="40" r="7.5" stroke="#10B981" stroke-width="1.5" opacity="0.6" />
</svg>
